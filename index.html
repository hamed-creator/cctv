<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera wall</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  figure { margin: 0; background: #111; border-radius: 8px; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; background: #000; }
  figcaption { display: flex; justify-content: space-between; gap: 8px;
               padding: 6px 10px; color: #ddd; font-size: 12px; }
</style>
</head>
<body>
<div class="grid" id="wall"></div>

<script type="module">
import { CameraStream } from './app.js';

const wall = document.querySelector('#wall');
const streams = new Map();
const socketProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';

function addCamera(id, label) {
  if (streams.has(String(id))) return;

  const figure = document.createElement('figure');
  const canvas = document.createElement('canvas');
  const caption = document.createElement('figcaption');
  const name = document.createElement('span');
  const stats = document.createElement('span');

  name.textContent = label;
  figure.append(canvas, caption);
  caption.append(name, stats);
  wall.append(figure);

  const stream = new CameraStream(
    `${socketProtocol}//${location.host}/camera/${encodeURIComponent(id)}`,
    canvas,
  );

  stream.addEventListener('stats', (event) => {
    const { fps, bufferedFrames, state } = event.detail;
    stats.textContent = `${state} · ${fps.toFixed(1)} fps · buf ${bufferedFrames}`;
  });
  stream.addEventListener('error', (event) => {
    stats.textContent = event.detail.message;
  });

  stream.start();
  streams.set(id, { stream, figure });
}

function removeCamera(id) {
  const entry = streams.get(id);
  if (!entry) return;
  entry.stream.destroy();   // closes socket, decoder, and all buffered frames
  entry.figure.remove();
  streams.delete(id);
}

async function loadCameras() {
  const response = await fetch('/api/cameras');
  if (!response.ok) {
    throw new Error(`Camera configuration request failed (${response.status})`);
  }

  const cameras = await response.json();
  cameras.forEach((camera) => addCamera(camera.id, camera.name));
}

window.addEventListener('pagehide', () => {
  for (const id of [...streams.keys()]) removeCamera(id);
});

// Exposed for console experimentation.
Object.assign(window, { addCamera, removeCamera, streams });

loadCameras().catch((error) => {
  wall.textContent = `Unable to load cameras: ${error.message}`;
});
</script>
</body>
</html>
