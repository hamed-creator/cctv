<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera wall</title>
<link rel="icon" href="/favicon.jpg">
<style>
  :root { color-scheme: light dark; }
  [hidden] { 
  display: none !important; 
  }
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .grid.has-focus figure { display: none; }
  .grid.has-focus figure.focused {
    display: block;
    grid-column: 1 / -1;
  }
  .grid.has-focus figure.focused .frame { aspect-ratio: 16 / 10; }
  figure { margin: 0; background: #111; border-radius: 8px; overflow: hidden; }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .preview { position: absolute; inset: 0; display: grid; min-height: 180px; place-items: center; background: #000; }
  button { cursor: pointer; padding: 8px 12px; border: 1px solid #666; border-radius: 4px; }
  .badge { padding: 2px 6px; border-radius: 999px; background: #222; font-size: 11px; font-weight: 600; }
  .badge[data-state="idle"],
  .badge[data-state="destroyed"] { color: #b8b8b8; background: #282828; }
  .badge[data-state="disconnected"],
  .badge[data-state="unsupported"] { color: #f0a0a0; background: #321b1b; }
  .badge[data-state="connecting"],
  .badge[data-state="connected"],
  .badge[data-state="buffering"],
  .badge[data-state="resyncing"] { color: #f4c96b; background: #342b16; }
  .badge[data-state="streaming"] { color: #8ee0a8; background: #173222; }
  figcaption { display: flex; justify-content: space-between; gap: 8px;
               min-width: 0; padding: 6px 10px; color: #ddd; font-size: 12px; }
  .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats { color: #999; white-space: nowrap; flex-shrink: 0; }
  body.hide-analytics #diagnostics { display: none !important; }
</style>
</head>
<body>
<div class="toolbar">
  <span id="live-count"></span>
  <button id="start-all" type="button">Start all</button>
  <button id="stop-all" type="button">Stop all</button>
  <button id="toggle-analytics" type="button">Hide analytics</button>
</div>
<div class="grid" id="wall"></div>

<script type="module">
import { CameraStream } from './app.js';

const wall = document.querySelector('#wall');
const liveCount = document.querySelector('#live-count');
const startAllButton = document.querySelector('#start-all');
const stopAllButton = document.querySelector('#stop-all');
const toggleAnalyticsButton = document.querySelector('#toggle-analytics');
const streams = new Map();
const socketProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';

toggleAnalyticsButton.addEventListener('click', () => {
  document.body.classList.toggle('hide-analytics');
  const isHidden = document.body.classList.contains('hide-analytics');
  toggleAnalyticsButton.textContent = isHidden ? 'Show analytics' : 'Hide analytics';
});

function updateLiveCount() {
  const live = [...streams.values()].filter((entry) => entry.stream !== null).length;
  liveCount.textContent = `${live} of ${streams.size} live`;
}

function addCamera(id, label) {
  const cameraId = String(id);
  if (streams.has(cameraId)) return streams.get(cameraId);

  const figure = document.createElement('figure');
  const frame = document.createElement('div');
  const canvas = document.createElement('canvas');
  const preview = document.createElement('div');
  const startButton = document.createElement('button');
  const stopButton = document.createElement('button');
  const caption = document.createElement('figcaption');
  const name = document.createElement('span');
  const badge = document.createElement('span');
  const stats = document.createElement('span');

  name.className = 'name';
  stats.className = 'stats';
  frame.className = 'frame';
  preview.className = 'preview';
  startButton.type = 'button';
  startButton.textContent = 'Start stream';
  preview.append(startButton);
  stopButton.type = 'button';
  stopButton.textContent = 'Stop stream';
  stopButton.hidden = true;
  canvas.hidden = true;
  name.textContent = label;
  badge.className = 'badge';
  stats.textContent = 'idle';
  frame.append(canvas, preview);
  figure.append(frame, caption);
  caption.append(name, badge, stats, stopButton);
  wall.append(figure);

  const entry = { cameraId, stream: null, figure, canvas, preview, startButton, stopButton };

  function startStream() {
    if (entry.stream) return;

    entry.stream = new CameraStream(
      `${socketProtocol}//${location.host}/camera/${encodeURIComponent(cameraId)}`,
      canvas,
    );
    updateLiveCount();
    entry.stream.addEventListener('stats', (event) => {
      const { fps, bufferedFrames, state } = event.detail;
      stats.textContent = `${state} · ${fps.toFixed(1)} fps · buf ${bufferedFrames}`;
    });
    entry.stream.addEventListener('state', (event) => {
      const state = event.detail.state;
      const labels = {
        idle: 'Idle',
        connecting: 'Connecting',
        connected: 'Connecting',
        buffering: 'Buffering',
        resyncing: 'Resyncing',
        streaming: 'Live',
        disconnected: 'Disconnected',
        unsupported: 'Unsupported',
        destroyed: 'Stopped',
      };
      badge.dataset.state = state;
      badge.textContent = labels[state];
      stats.textContent = state;
    });
    entry.stream.addEventListener('error', (event) => {
      stats.textContent = event.detail.message;
    });
    entry.stream.start();
    canvas.hidden = false;
    preview.hidden = true;
    startButton.hidden = true;
    stopButton.hidden = false;
  }

  function stopStream() {
    if (entry.stream) {
      entry.stream.destroy();
      entry.stream = null;
      updateLiveCount();
    }
    entry.canvas.hidden = true;
    entry.preview.hidden = false;
    entry.startButton.hidden = false;
    entry.stopButton.hidden = true;
  }

  entry.startStream = startStream;
  entry.stopStream = stopStream;

  startButton.addEventListener('click', (event) => {
    event.stopPropagation();
    startStream();
  });
  stopButton.addEventListener('click', (event) => {
    event.stopPropagation();
    stopStream();
  });
  figure.addEventListener('click', () => {
    const isFocused = figure.classList.contains('focused');
    wall.querySelector('figure.focused')?.classList.remove('focused');
    figure.classList.toggle('focused', !isFocused);
    wall.classList.toggle('has-focus', !isFocused);
  });
  figure.addEventListener('dblclick', startStream);
  streams.set(cameraId, entry);
  return entry;
}

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  wall.querySelector('figure.focused')?.classList.remove('focused');
  wall.classList.remove('has-focus');
});

function stopStream(cameraId) {
  const entry = streams.get(String(cameraId));
  entry?.stopStream();
}

function removeCamera(id) {
  const entry = streams.get(String(id));
  if (!entry) return;
  entry.stream?.destroy();
  entry.figure.remove();
  streams.delete(String(id));
}

async function loadCameras() {
  const response = await fetch('/api/cameras');
  if (!response.ok) {
    throw new Error(`Camera configuration request failed (${response.status})`);
  }

  const cameras = await response.json();
  cameras.forEach((camera) => addCamera(camera.id, camera.name));
  updateLiveCount();
}

startAllButton.addEventListener('click', () => {
  for (const entry of streams.values()) {
    if (!entry.stream) entry.startStream();
  }
});

stopAllButton.addEventListener('click', () => {
  for (const entry of streams.values()) {
    if (entry.stream) entry.stopStream();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') {
    return;
  }

  for (const [, entry] of streams.entries()) {
    if (!entry.stream) continue;
    stopStream(entry.cameraId);
    entry.startButton.textContent = 'Resume stream';
  }
});

// Exposed for console experimentation.
Object.assign(window, { addCamera, removeCamera, stopStream, streams });

setInterval(async () => {
  try {
    const response = await fetch('/api/cameras');
    const cameras = await response.json();
    let diagnosticHtml = `<table style="width:100%; border-collapse: collapse; text-align: left; font-size: 11px;">
      <tr><th>Camera</th><th>State</th><th>Clients</th><th>FFmpeg KBs</th><th>SendQ</th><th>SoftDrops</th><th>HardDrops</th><th>C:FPS</th><th>C:DecQ</th><th>C:BufQ</th><th>C:PumpDrops</th><th>C:BufDrops</th><th>C:DecErr</th></tr>`;
    
    cameras.forEach((camera) => {
      const entry = streams.get(String(camera.id));
      let cStats = { fps: 0, decodeQueue: 0, bufferedFrames: 0, dropsPump: 0, dropsBuffer: 0, decoderErrors: 0 };
      if (entry && entry.stream && entry.stream.stats) {
        cStats = entry.stream.stats;
      }
      diagnosticHtml += `<tr style="border-bottom: 1px solid #444;">
        <td>${camera.id}</td>
        <td>${camera.state}</td>
        <td>${camera.clients}</td>
        <td>${camera.kilobytes}</td>
        <td>${camera.sendQueue !== undefined ? camera.sendQueue : 0}</td>
        <td>${camera.dropsSoft !== undefined ? camera.dropsSoft : 0}</td>
        <td>${camera.dropsHard !== undefined ? camera.dropsHard : 0}</td>
        <td>${cStats.fps ? cStats.fps.toFixed(1) : 0}</td>
        <td>${cStats.decodeQueue}</td>
        <td>${cStats.bufferedFrames}</td>
        <td>${cStats.dropsPump}</td>
        <td>${cStats.dropsBuffer}</td>
        <td>${cStats.decoderErrors}</td>
      </tr>`;
    });
    diagnosticHtml += `</table>`;
    
    let diagDiv = document.getElementById('diagnostics');
    if (!diagDiv) {
      diagDiv = document.createElement('div');
      diagDiv.id = 'diagnostics';
      diagDiv.style.cssText = 'position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; padding: 10px; z-index: 9999; max-height: 200px; overflow-y: auto;';
      document.body.appendChild(diagDiv);
    }
    diagDiv.innerHTML = diagnosticHtml;
  } catch (e) {
    // Ignore fetch errors
  }
}, 1000);

loadCameras().catch((error) => {
  wall.textContent = `Unable to load cameras: ${error.message}`;
});
</script>
</body>
</html>
